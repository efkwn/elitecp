<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>eLite CP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="loginView" class="login-shell hidden">
    <div class="login-card">
      <div class="brand brand-large"><span class="brand-mark">e</span><span>eLite CP</span></div>
      <p class="muted">Botlarını sade, hızlı ve güvenli şekilde yönet.</p>
      <form id="loginForm" class="stack gap-lg">
        <label>Kullanıcı adı<input id="loginUser" autocomplete="username" required placeholder="admin"></label>
        <label>Şifre<input id="loginPass" type="password" autocomplete="current-password" required placeholder="••••••••••"></label>
        <button class="btn primary wide" type="submit">Giriş Yap</button>
      </form>
      <div class="login-foot">Python · Node.js · Docker</div>
    </div>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">e</span><span>eLite CP</span></div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-view="bots"><span>◫</span> Botlar</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-status"><span id="dockerDot" class="dot"></span><span id="dockerText">Docker kontrol ediliyor</span></div>
      <button id="logoutBtn" class="nav-item danger"><span>↗</span> Çıkış</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobileMenu" class="icon-btn mobile-only">☰</button>
        <div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle" class="muted">Bot altyapının kısa özeti.</p></div>
        <div class="top-actions"><span id="userChip" class="chip"></span><button id="newBotBtn" class="btn primary">+ Yeni Bot</button></div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <dialog id="botDialog" class="dialog">
    <form id="botForm" method="dialog" class="dialog-card">
      <div class="dialog-head"><div><h2>Yeni Bot</h2><p class="muted">İlk bot container'ını oluştur.</p></div><button type="button" class="icon-btn" data-close-dialog>×</button></div>
      <div class="grid two">
        <label>Bot adı<input name="name" required maxlength="64" placeholder="Discord Bot"></label>
        <label>Runtime<select name="runtime" id="runtimeSelect"><option value="python">Python 3.12</option><option value="node">Node.js 22</option></select></label>
        <label>RAM (MB)<input name="memory_mb" type="number" min="64" max="32768" value="512" required></label>
        <label>CPU<input name="cpus" type="number" min="0.1" max="32" step="0.1" value="0.5" required></label>
      </div>
      <label>Başlatma komutu<textarea name="startup" id="startupInput" rows="4"></textarea></label>
      <div class="dialog-actions"><button type="button" class="btn ghost" data-close-dialog>Vazgeç</button><button type="submit" class="btn primary">Botu Oluştur</button></div>
    </form>
  </dialog>

  <dialog id="editorDialog" class="dialog editor-dialog">
    <div class="dialog-card editor-card">
      <div class="dialog-head"><div><h2 id="editorTitle">Dosya</h2><p id="editorPath" class="muted mono"></p></div><button type="button" class="icon-btn" id="closeEditor">×</button></div>
      <textarea id="fileEditor" class="code-editor" spellcheck="false"></textarea>
      <div class="dialog-actions"><button type="button" class="btn ghost" id="cancelEditor">Kapat</button><button type="button" class="btn primary" id="saveEditor">Kaydet</button></div>
    </div>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
